name: Security Audit

on:
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Ejecución programada: todos los lunes a las 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-frontend:
    name: Frontend Security Audit (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Run npm audit (High & Critical threshold)
        run: npm audit --prefix frontend --audit-level=high

  audit-backend:
    name: Backend Security Audit (pip / uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run pip-audit via uvx
        run: |
          cd backend
          uvx pip-audit
