version: 2
updates:
  # Monitoreo y actualizaciones de dependencias en Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(frontend-deps)"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      development-dependencies:
        dependency-type: "development"
      testing-libraries:
        patterns:
          - "vitest*"
          - "@testing-library*"
          - "msw"

  # Monitoreo y actualizaciones de dependencias en Backend (pip / uv)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(backend-deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      dev-and-testing:
        patterns:
          - "pytest*"
          - "ruff"
