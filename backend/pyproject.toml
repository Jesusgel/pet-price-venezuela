[project]
name = "pet-price-venezuela"
version = "0.1.0"
description = "Backend for pet-price-venezuela"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "alembic",
    "asyncpg",
    "httpx",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
]

[tool.ruff]
line-length = 88
